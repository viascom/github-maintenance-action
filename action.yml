name: "GitHub Maintenance Action"
description: "Deletes old workflow runs, or only their logs and artifacts, with filters, a minimum number of runs to keep and a dry run."
author: "Viascom Ltd liab. Co"

branding:
  icon: "trash-2"
  color: "purple"

inputs:
  github_token:
    description: "Token with the 'actions: write' permission on the repository. The workflow's GITHUB_TOKEN works when the job grants it."
    required: true
    default: ${{ github.token }}
  repository:
    description: "Repository to clean, as owner/repo."
    required: true
    default: ${{ github.repository }}
  retention_days:
    description: "Workflow runs created more than this many days ago are candidates. 0 means every run."
    required: false
    default: "31"
  keep_minimum_runs:
    description: "The newest runs of the repository that are always kept, whatever their age."
    required: false
    default: "5"
  github_base_url:
    description: "REST API base URL, for GitHub Enterprise Server: https://HOST/api/v3."
    required: false
    default: "https://api.github.com"
  delete_logs:
    description: "Delete only the logs of the matching runs. With delete_artifacts also false, the whole run is deleted."
    required: false
    default: "false"
  delete_artifacts:
    description: "Delete only the artifacts of the matching runs. With delete_logs also false, the whole run is deleted."
    required: false
    default: "false"
  actors:
    description: "Comma-separated logins; only runs triggered by these users are candidates."
    required: false
    default: ""
  branches:
    description: "Comma-separated branch names; only runs of these branches are candidates."
    required: false
    default: ""
  events:
    description: "Comma-separated trigger events, for example push,schedule; only runs with these events are candidates."
    required: false
    default: ""
  statuses:
    description: "Comma-separated statuses or conclusions (completed, success, failure, cancelled, skipped, timed_out, ...); only matching runs are candidates."
    required: false
    default: ""
  keep_pull_requests:
    description: "Keep runs triggered by pull_request and pull_request_target."
    required: false
    default: "false"
  dry_run:
    description: "Log what would be deleted without deleting anything."
    required: false
    default: "false"
  debug:
    description: "Log every API request."
    required: false
    default: "false"

outputs:
  runs_deleted:
    description: "Number of workflow runs deleted (or that would be, in a dry run)."
  logs_deleted:
    description: "Number of workflow run logs deleted (or that would be, in a dry run)."
  artifacts_deleted:
    description: "Number of artifacts deleted (or that would be, in a dry run)."
  failures:
    description: "Number of operations that failed. The step fails when this is not 0."

runs:
  using: "docker"
  image: "docker://ghcr.io/viascom/github-maintenance-action:1.0.0"
